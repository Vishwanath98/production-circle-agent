name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Circle and shared dependencies
        run: python -m pip install -e agent-spine -r circle-agent/requirements.txt
      - name: Shared foundation tests
        env:
          PYTHONPATH: agent-spine:circle-agent
        run: python -m unittest discover -s agent-spine/tests -v
      - name: Circle tests
        env:
          PYTHONPATH: agent-spine:circle-agent
        run: python -m unittest discover -s circle-agent/tests -v
      - name: Onboarding tests
        env:
          PYTHONPATH: agent-spine:onboarding-agent
        run: python -m unittest discover -s onboarding-agent/tests -v
      - name: Compile Python
        env:
          PYTHONPYCACHEPREFIX: /tmp/production-circle-agent-pycache
        run: python -m compileall -q agent-spine/agent_spine circle-agent/circle_agent onboarding-agent/onboarding_agent
